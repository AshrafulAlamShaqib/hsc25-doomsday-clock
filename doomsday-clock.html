<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HSC'25 Doomsday Clock</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      color: #333;
    }

    #timer {
      font-size: 2rem;
      color: #ff4444;
      margin-top: 20px;
    }

    #deadline-label {
      margin-top: 10px;
      font-size: 1rem;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>HSC june 26, 2025</h1>
  <div id="timer">Loading...</div>

  <script>
    // You can write your countdown logic here
    const deadline = new Date("2025-06-26T00:00:00"); // change this

    function updateTimer() {
      const now = new Date();
      const diff = deadline - now;

      if (diff <= 0) {
        document.getElementById("timer").textContent = "Deadline reached!";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("timer").textContent =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    setInterval(updateTimer, 1000);
    updateTimer(); // Initial call
  </script>

</body>
</html>
